name: Clipx
options:
  bundleIdPrefix: com.clipx
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    GENERATE_INFOPLIST_FILE: NO
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: "6.29.3"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.6"
targets:
  Clipx-Direct:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # NOT a folder reference: the asset catalog must compile to Assets.car so
      # the AppIcon is processed and CFBundleIconName is injected. A folder ref
      # copies the raw .xcassets and the icon never applies.
      - path: Resources
    info:
      path: Configs/Info.plist
      properties:
        CFBundleDisplayName: Clipx
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSLocalNetworkUsageDescription: Clipx connects to your chosen review server and shares your library with paired browsers when you enable Remote.
        NSAppleEventsUsageDescription: Clipx uses Apple Events to capture the frontmost video clip when the global hotkey is pressed.
        NSDesktopFolderUsageDescription: Clipx needs to read video files stored on your Desktop to index and generate thumbnails for your library.
        NSDocumentsFolderUsageDescription: Clipx needs to read video files stored in Documents to index and generate thumbnails for your library.
        NSDownloadsFolderUsageDescription: Clipx needs to read video files stored in Downloads to index and generate thumbnails for your library.
        NSRemovableVolumesUsageDescription: Clipx reads video files from removable drives so you can clip footage stored on external media.
        NSNetworkVolumesUsageDescription: Clipx reads video files from network volumes so you can clip footage stored on NAS or shared drives.
        SUFeedURL: https://updates.clipx.app/appcast.xml
        SUPublicEDKey: PLACEHOLDER_REPLACE_WITH_GENERATED_KEY
    entitlements:
      path: Configs/Clipx-Direct.entitlements
      properties:
        com.apple.security.cs.allow-jit: false
        com.apple.security.cs.allow-unsigned-executable-memory: false
        com.apple.security.cs.disable-library-validation: true
        com.apple.security.automation.apple-events: true
    settings:
      base:
        CLIPX_BUNDLE_IDENTIFIER: com.clipx.Clipx
        PRODUCT_BUNDLE_IDENTIFIER: $(CLIPX_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: Clipx
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DIRECT_BUILD
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: GRDB
        product: GRDB
      - package: Sparkle
        product: Sparkle
    postBuildScripts:
      - path: Scripts/copy-ffmpeg.sh
        name: Bundle FFmpeg
        shell: /bin/bash
        showEnvVars: false
        basedOnDependencyAnalysis: false
  Clipx-MAS:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "ClipxHotkey/**"
          - "ClipxSparkle/**"
          - "ClipxExport/FFmpegBackend.swift"
      # See Clipx-Direct: compile the catalog (no folder ref) so the icon applies.
      - path: Resources
    info:
      path: Configs/Info-MAS.plist
      properties:
        CFBundleDisplayName: Clipx
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSLocalNetworkUsageDescription: Clipx connects to your chosen review server and shares your library with paired browsers when you enable Remote.
    entitlements:
      path: Configs/Clipx-MAS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.assets.movies.read-write: true
        com.apple.security.assets.music.read-only: true
    settings:
      base:
        CLIPX_BUNDLE_IDENTIFIER: com.clipx.Clipx
        PRODUCT_BUNDLE_IDENTIFIER: $(CLIPX_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: Clipx
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: MAS_BUILD
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: GRDB
        product: GRDB
  ClipxCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ClipxCoreTests
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DIRECT_BUILD
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Clipx.app/Contents/MacOS/Clipx
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Clipx-Direct
  ClipxCoreTests-MAS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ClipxCoreTests
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: MAS_BUILD
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Clipx.app/Contents/MacOS/Clipx
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Clipx-MAS
  ClipxUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/ClipxUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Clipx-Direct
    dependencies:
      - target: Clipx-Direct
schemes:
  Clipx-UI:
    build:
      targets:
        Clipx-Direct: all
    test:
      config: Debug
      environmentVariables:
        CLIPX_ISOLATED_TESTS: "1"
      targets:
        - ClipxUITests
  Clipx-Direct:
    build:
      targets:
        Clipx-Direct: all
    run:
      config: Debug
    test:
      config: Debug
      environmentVariables:
        CLIPX_ISOLATED_TESTS: "1"
      targets:
        - ClipxCoreTests
    archive:
      config: Release
  Clipx-MAS:
    build:
      targets:
        Clipx-MAS: all
    run:
      config: Debug
    test:
      config: Debug
      environmentVariables:
        CLIPX_ISOLATED_TESTS: "1"
      targets:
        - ClipxCoreTests-MAS
    archive:
      config: Release
